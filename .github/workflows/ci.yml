name: Inventory CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'rc-*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:

  validate:
    name: Validate
    runs-on: ubuntu-latest
    container: python:3.12.7-slim
    steps:
      - uses: actions/checkout@v4
      - name: Show versions
        run: |
          python --version
          echo "Commit: $GITHUB_SHA"
      - name: Check Dockerfile and .dockerignore
        run: |
          test -f Dockerfile || { echo "Dockerfile missing"; exit 1; }
          test -f .dockerignore || { echo ".dockerignore missing"; exit 1; }
          echo "Dockerfile and .dockerignore found"
      - name: Compile all Python files
        run: python -m compileall -q .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    container: python:3.12.7-slim
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Run unittest
        run: python -m unittest discover -s tests -v

  package:
    name: Package artifact
    runs-on: ubuntu-latest
    container: python:3.12.7-slim
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Build dist
        run: |
          mkdir -p dist
          cp inventory.py README.md Dockerfile inventory.json.example dist/
          echo "Commit: $GITHUB_SHA" > dist/manifest.txt
          echo "Pipeline: $GITHUB_RUN_ID" >> dist/manifest.txt
          echo "Files:" >> dist/manifest.txt
          ls dist >> dist/manifest.txt
          cat dist/manifest.txt
      - name: Upload artifact (7 days)
        if: ${{ !startsWith(github.ref, 'refs/tags/rc-') }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
      - name: Upload artifact (2 days for rc-*)
        if: startsWith(github.ref, 'refs/tags/rc-')
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 2

  deploy_test:
    name: Deploy to test/inventory
    runs-on: ubuntu-latest
    container: python:3.12.7-slim
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment:
      name: test/inventory
      url: https://example.com/test/inventory
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: deploy/test
      - name: Smoke test — add device to temporary JSON
        run: |
          python - <<'PY'
          import json, tempfile, os

          tmp = tempfile.NamedTemporaryFile(delete=False, suffix=".json")
          tmp.close()
          path = tmp.name

          devices = [{"id": 1, "name": "Router R1", "serial": "SN-001"}]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(devices, f)

          # smoke-проверка: добавляем новое устройство во временный JSON
          new_device = {"id": 2, "name": "Switch S1", "serial": "SN-002"}
          devices.append(new_device)
          with open(path, "w", encoding="utf-8") as f:
              json.dump(devices, f)

          with open(path, encoding="utf-8") as f:
              loaded = json.load(f)

          assert len(loaded) == 2, "Smoke test failed: device not added"
          print("Smoke test passed:", loaded)
          os.unlink(path)
          PY
      - name: Write deployment report
        run: |
          echo "Environment: test/inventory" > deployment.txt
          echo "Commit: $GITHUB_SHA" >> deployment.txt
          echo "Pipeline: $GITHUB_RUN_ID" >> deployment.txt
          echo "Status: success" >> deployment.txt
          cat deployment.txt
      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deployment.txt
          retention-days: 7